name: Engineering evidence checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-lock.txt
      - run: pytest --cov=src/backend --cov-fail-under=80
      - run: ruff check src/backend tests
      - run: bandit -r src/backend -q
      - run: pip-audit -r requirements-lock.txt
      - run: python tools/check_prompt_logs.py
      - run: npm ci && npm run build && npm audit --omit=dev --audit-level=high
        working-directory: src/frontend
