name: Curriculum verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python tools/validate_curriculum.py
      - run: python -m unittest discover -s curriculum/weeks/04/demo -v
      - run: python -m unittest discover -s curriculum/weeks/11/demo -v
      - run: python tools/check_reference_demos.py
      - run: python -m pip install -r infrastructure/template/requirements-lock.txt
      - run: pytest --cov=src/backend --cov-fail-under=80 && ruff check src/backend tests && bandit -r src/backend -q
        working-directory: infrastructure/template
      - run: npm ci && npm run build
        working-directory: infrastructure/template/src/frontend
      - name: Build and verify PostgreSQL reference
        working-directory: infrastructure/template
        run: |
          docker compose build
          docker compose up -d db
          docker compose run --rm app alembic upgrade head
          docker compose run --rm app python -m src.backend.seed
          docker compose up -d app
          python ../../tools/smoke_reference.py
      - name: Container logs and cleanup
        if: always()
        working-directory: infrastructure/template
        run: |
          docker compose logs --no-color
          docker compose down
